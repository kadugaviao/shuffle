schema: spec-driven

context: |
  Projeto: "Shuffle", sistema web para cadastrar músicas que o usuário já conhece e sortear qual tocar.
  Trabalho acadêmico de Engenharia de Software (G2, trio). Apresentação em 24/11/2026: prazo curto.
  Metodologia obrigatória: OpenSpec. Especificar e documentar antes de programar; o histórico de commits
  deve mostrar as specs antes do código. Plano completo em docs/plan.md.

  Stack:
  - Back-end: Python 3 + Flask.
  - Banco: SQLite, acessado pelo módulo sqlite3 da biblioteca padrão (sem ORM).
  - Front-end: templates Jinja + HTML/CSS/JS puro (sem React, sem bundler). Interface responsiva (celular).

  Convenções:
  - Código, nomes de tabelas e colunas em português, sem acentos e em snake_case (ex.: artista_id, criado_em).
  - Mensagens e textos da interface em português (com acentos).
  - Todos os artefatos OpenSpec escritos em português.

  Restrições:
  - Preferir simplicidade a abstrações: sem camadas extras, sem ORM, sem dependências além do Flask.
  - Escopo obrigatório: banco com no mínimo 2 tabelas e CRUD completo (artistas e músicas) da tela ao banco.

rules:
  specs:
    - Requisitos usam DEVE / NÃO DEVE e citam o código da regra de negócio (RN01..RN08) quando houver.
    - Cenários usam GIVEN/WHEN/THEN.
  tasks:
    - Tarefas pequenas, ordenadas e verificáveis (cada uma diz como conferir que ficou pronta).

{# Componentes do design system "Lambe-lambe". Importar com: {% from "_macros.html" import campo, aria, ... %} #}
{% from "_icones.html" import icone %}

{# Atributos do controle de um campo: id para o <label for>, e aria-invalid/aria-describedby se houver erro. #}
{% macro aria(nome, erros) -%}
id="campo-{{ nome }}"{% if erros and erros.get(nome) %} aria-invalid="true" aria-describedby="erro-{{ nome }}"{% endif %}
{%- endmacro %}

{% macro erro(nome, erros) -%}
{% if erros and erros.get(nome) %}<p class="erro-campo" id="erro-{{ nome }}">{{ icone("alerta") }}{{ erros[nome] }}</p>{% endif %}
{%- endmacro %}

{# Campo com rótulo e erro logo abaixo; o controle vem no corpo do {% call %} e usa aria(nome, erros). #}
{% macro campo(nome, rotulo, erros) -%}
<div class="campo">
  <label for="campo-{{ nome }}">{{ rotulo }}</label>
  {{ caller() }}
  {{ erro(nome, erros) }}
</div>
{%- endmacro %}

{# Grupo de chips (radios) com legenda; `todos` cria a opção vazia ("Todos", "Qualquer"...).
   `atual` pode chegar indefinido (filtro ausente no dict): conta como vazio. #}
{% macro chips(nome, rotulo, opcoes, atual, todos=none, erros=none, classe="chips") -%}
<fieldset class="campo"{% if erros and erros.get(nome) %} aria-describedby="erro-{{ nome }}"{% endif %}>
  <legend>{{ rotulo }}</legend>
  <div class="{{ classe }}">
    {% if todos %}
    <label class="chip"><input type="radio" name="{{ nome }}" value="" {% if atual is not defined or atual is none or atual == "" %}checked{% endif %}><span>{{ todos }}</span></label>
    {% endif %}
    {% for valor, texto in opcoes %}
    <label class="chip"><input type="radio" name="{{ nome }}" value="{{ valor }}" {% if atual is defined and atual is not none and atual|string|lower == valor|string|lower %}checked{% endif %}><span>{{ texto }}</span></label>
    {% endfor %}
  </div>
  {{ erro(nome, erros) }}
</fieldset>
{%- endmacro %}

{# Capa chapada: amarelo, vermelho ou tinta pelo nome do artista (design D8); decorativa, o nome aparece ao lado. #}
{% macro capa(nome, grande=false) -%}
<span class="capa capa-{{ (nome|matiz) % 3 }}{% if grande %} capa-grande{% endif %}" aria-hidden="true">{{ nome|iniciais }}</span>
{%- endmacro %}

{% macro dificuldade(nivel) -%}
<span class="dificuldade" role="img" aria-label="Dificuldade {{ nivel }} de 5">{% for i in range(1, 6) %}<span{% if i <= nivel %} class="cheia"{% endif %}></span>{% endfor %}</span>
{%- endmacro %}

{# Estado vazio: a tipografia faz o trabalho; título, frase e, opcionalmente, o botão primário. #}
{% macro vazio(titulo, texto, cta_url=none, cta_texto=none, icone_cta="mais") -%}
<div class="estado-vazio">
  <h2>{{ titulo }}</h2>
  {% if texto %}<p>{{ texto }}</p>{% endif %}
  {% if cta_url %}<a class="botao primario" href="{{ cta_url }}">{{ icone(icone_cta) }}{{ cta_texto }}</a>{% endif %}
</div>
{%- endmacro %}

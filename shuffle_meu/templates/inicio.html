{% extends "base.html" %}
{% block titulo %}Início{% endblock %}
{% block conteudo %}
<form class="cartao campos" method="post" action="{{ url_for('sorteio.sortear') }}">
  <button class="primario sortear">🎲 Sortear</button>
  <div class="grade">
    <label>Gênero
      <select name="genero">
        <option value="">Todos</option>
        {% for g in generos %}<option {% if (f.genero or '')|lower == g|lower %}selected{% endif %}>{{ g }}</option>{% endfor %}
      </select>
    </label>
    <label>Humor
      <select name="humor">
        <option value="">Todos</option>
        {% for valor, rotulo in HUMORES.items() %}
        <option value="{{ valor }}" {% if f.humor == valor %}selected{% endif %}>{{ rotulo }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Dificuldade máxima
      <select name="dificuldade_max">
        <option value="">Qualquer</option>
        {% for i in range(1, 6) %}<option {% if f.dificuldade_max == i %}selected{% endif %}>{{ i }}</option>{% endfor %}
      </select>
    </label>
    <label>Artista
      <select name="artista_id">
        <option value="">Todos</option>
        {% for a in artistas %}<option value="{{ a.id }}" {% if f.artista_id == a.id %}selected{% endif %}>{{ a.nome }}</option>{% endfor %}
      </select>
    </label>
    <label>Playlist
      <select name="playlist_id">
        <option value="">Todas</option>
        {% for p in playlists %}<option value="{{ p.id }}" {% if f.playlist_id == p.id %}selected{% endif %}>{{ p.nome }}</option>{% endfor %}
      </select>
    </label>
    <label>Não repetir as últimas
      <input name="n" type="number" min="0" max="50" value="{{ n }}">
    </label>
  </div>
</form>
{% if ultimo %}
<p class="cartao">Última sorteada: {{ ultimo.titulo }} — {{ ultimo.artista }}
  <span class="meta">({{ ultimo.sorteado_em|data_local }})</span></p>
{% endif %}
{% endblock %}
